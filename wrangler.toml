name = "fintrack-api"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "fintrack-db"
database_id = "dd65e542-131c-490f-bb98-9bc618d5d831"

[[r2_buckets]]
binding = "SLIPS"
bucket_name = "fintrack-slips"

# กันยิงเดา public_token ที่ /receipt/* — endpoint พวกนี้เปิดสาธารณะเพราะคู่ค้าไม่มีบัญชี
# ใช้ binding ของ Worker ไม่ใช่ WAF เพราะ workers.dev ไม่ใช่ zone ของเรา ตั้ง rule ที่ Dashboard ไม่ได้
# 20 ครั้ง/นาที/IP — คู่ค้าเปิดหน้าซ้ำ ๆ ยังพอ แต่ไล่เดา token ไม่ไหว
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[durable_objects.bindings]]
name = "REALTIME"
class_name = "WorkspaceRoom"

[[migrations]]
tag = "v1"
new_classes = ["WorkspaceRoom"]

# Runs hourly so recurring items fire at their chosen due_hour (Thai time = UTC+7).
# NULL due_hour defaults to 08:00. cleanupDrafts runs at Thai 00:00.
[triggers]
crons = ["0 * * * *"]
